name: 긱뉴스 동기화

# 긱뉴스는 제목·요약·본문을 원문 그대로 저장하므로 LLM 을 쓰지 않는다.
# API 키가 필요 없고 비용도 들지 않는다.
#
# 목록을 적재한 뒤 상세 페이지를 열어 본문("함께 보면 좋은 글" 직전까지)을
# hada_contents 에 담는다. 경계가 리터럴 문자열이라 DOM 절단으로 정확히 끊긴다.

# 언제 도나 — Supabase pg_cron 이 07:00 · 11:30 KST 에 workflow_dispatch 로 깨운다
# (supabase/migrations/0022_sync_dispatch.sql). GitHub schedule 은 2~4시간씩 밀려서
# 시계로 쓰지 않는다. 그 호출이 끊기면 sync-watchdog.yml 이 늦게라도 대신 돌린다.
#
# 이 파일에 schedule 을 다시 달지 말 것. 공개 저장소에서 schedule 이 걸린 워크플로는
# 60일간 커밋이 없으면 GitHub 이 통째로 꺼 버리고, 꺼진 워크플로는 dispatch 도 받지
# 않는다 — pg_cron 의 호출까지 같이 죽는다.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전까지 수집할지"
        required: false
        default: "3"
      dry_run:
        description: "저장하지 않고 파싱 결과만 확인"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-geeknews
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEEK_LOOKBACK_DAYS: ${{ github.event.inputs.days || '3' }}
      GEEK_MAX_PAGES: "8"
      # 한 실행에서 상세 페이지를 몇 장까지 받아 본문을 채울지.
      # 요청 사이에 1.5초를 두므로 40건이면 약 1~2분이다.
      HADA_CONTENT_MAX_PER_RUN: "40"
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 긱뉴스 수집
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run sync:geeknews -- --dry-run
          else
            npm run sync:geeknews
          fi
