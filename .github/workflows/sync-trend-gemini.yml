name: 트렌드 브리핑 동기화 (Gemini)

# 수동 실행 전용. GEMINI_API_KEY 를 아직 등록하지 않았기 때문에 정기 실행은
# sync-trend-openai.yml 이 맡는다 (07:10 KST).
#
# 쓰는 상황
#   - Gemini 키를 발급해 붙인 뒤 품질·비용을 비교해 볼 때
#   - OpenAI 크레딧이 떨어졌을 때 임시 대체
#
# 자동 실행을 이쪽으로 되돌리려면 아래 schedule 주석을 풀고
# sync-trend-openai.yml 의 schedule 을 지운다. 두 워크플로를 동시에 자동
# 실행하면 같은 URL 을 두고 경쟁하게 되고(먼저 저장한 쪽이 이김) 비용도
# 이중으로 나간다.

on:
  # schedule:
  #   # 22:10 UTC = 07:10 KST
  #   - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 기사화할 최대 신규 건수"
        required: false
        default: "30"
      only:
        description: "수집할 출처 (github,hn,arxiv 쉼표 구분 · geeknews 는 '긱뉴스 동기화' 담당)"
        required: false
        default: "github,hn,arxiv"
      dry_run:
        description: "LLM 호출 없이 수집 대상만 확인"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-trend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      # 무료 티어는 gemini-2.5-flash 기준 10 RPM. 7초 간격이면 429 를 피한다.
      LLM_MIN_CALL_INTERVAL_MS: "7000"

      TREND_MAX_NEW: ${{ github.event.inputs.limit || '30' }}
      HN_MIN_SCORE: "150"
      # public repo 읽기용 (README 가져올 때 레이트리밋 완화). 없어도 동작한다.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 키 확인
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 없습니다. https://aistudio.google.com/apikey 에서 발급해 등록하세요."
            exit 1
          fi

      - name: 트렌드 브리핑 수집 및 기사 생성
        # only 를 비워 두면 스크립트 기본값(github,hn,arxiv)이 쓰인다.
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only=${{ github.event.inputs.only }}"
          npm run sync:trend -- $ARGS
