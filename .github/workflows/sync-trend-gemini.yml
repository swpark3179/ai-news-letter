name: 트렌드 브리핑 동기화 (Gemini)

# 일상 운용용. Google AI Studio 무료 티어 API 키를 쓴다.
# 같은 스크립트를 OpenAI 로 돌리려면 sync-trend-openai.yml 을 수동 실행한다.

on:
  schedule:
    # 22:10 UTC = 07:10 KST — 긱뉴스 동기화가 끝난 뒤에 돈다
    # (트렌드 브리핑이 긱뉴스 항목도 재료로 쓰기 때문)
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 기사화할 최대 신규 건수"
        required: false
        default: "30"
      only:
        description: "특정 출처만 (github,hn,arxiv,geeknews 쉼표 구분)"
        required: false
        default: ""
      dry_run:
        description: "LLM 호출 없이 수집 대상만 확인"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-trend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      # 무료 티어는 gemini-2.5-flash 기준 10 RPM. 7초 간격이면 429 를 피한다.
      LLM_MIN_CALL_INTERVAL_MS: "7000"

      TREND_MAX_NEW: ${{ github.event.inputs.limit || '30' }}
      HN_MIN_SCORE: "150"
      # public repo 읽기용 (README 가져올 때 레이트리밋 완화). 없어도 동작한다.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 키 확인
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 없습니다. https://aistudio.google.com/apikey 에서 발급해 등록하세요."
            exit 1
          fi

      - name: 트렌드 브리핑 수집 및 기사 생성
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only=${{ github.event.inputs.only }}"
          npm run sync:trend -- $ARGS
