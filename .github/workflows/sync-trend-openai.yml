name: 트렌드 브리핑 동기화 (OpenAI)

# 수동 실행 전용.
# 쓰는 상황
#   - Gemini 무료 티어 일일 할당량(RPD)을 소진했을 때
#   - 같은 원문을 다른 모델로 다시 써 보고 품질을 비교할 때
#   - 무료 티어의 데이터 이용 정책이 걸려 유료 API 로 처리해야 할 때
#
# schedule 을 넣지 않은 이유: 두 워크플로가 모두 자동으로 돌면 같은 URL 을 두고
# 경쟁하게 되고(먼저 저장한 쪽이 이김) API 비용도 이중으로 나간다.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 기사화할 최대 신규 건수"
        required: false
        default: "30"
      only:
        description: "특정 출처만 (github,hn,arxiv,geeknews 쉼표 구분)"
        required: false
        default: ""
      dry_run:
        description: "LLM 호출 없이 수집 대상만 확인"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-trend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      # 유료 API 는 rate limit 여유가 커서 간격을 짧게 둔다.
      LLM_MIN_CALL_INTERVAL_MS: "500"

      TREND_MAX_NEW: ${{ github.event.inputs.limit || '30' }}
      HN_MIN_SCORE: "150"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 키 확인
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿이 없습니다. https://platform.openai.com/api-keys 에서 발급해 등록하세요."
            exit 1
          fi

      - name: 트렌드 브리핑 수집 및 기사 생성
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only=${{ github.event.inputs.only }}"
          npm run sync:trend -- $ARGS
