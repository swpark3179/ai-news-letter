name: 트렌드 브리핑 동기화 (OpenAI)

# 정기 실행용. GEMINI_API_KEY 가 아직 등록돼 있지 않아 일상 운용을 이쪽이 맡는다.
# Gemini 키를 붙인 뒤에 다시 나누고 싶으면 sync-trend-gemini.yml 의 schedule 을
# 되살리고 이 파일의 schedule 을 지운다. 두 워크플로가 동시에 자동 실행되면 같은
# URL 을 두고 경쟁하게 되고(먼저 저장한 쪽이 이김) API 비용도 이중으로 나간다.

on:
  schedule:
    # 22:10 UTC = 07:10 KST — 긱뉴스 동기화가 끝난 뒤에 돈다
    # (긱뉴스는 '긱뉴스 동기화' 워크플로가 맡고, 이 워크플로는 긱뉴스를 다시
    #  기사화하지 않는다. 러너가 겹치지 않게 시간만 뒤로 둔다)
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 기사화할 최대 신규 건수"
        required: false
        default: "30"
      only:
        description: "수집할 출처 (github,hn,arxiv 쉼표 구분 · geeknews 는 '긱뉴스 동기화' 담당)"
        required: false
        default: "github,hn,arxiv"
      dry_run:
        description: "LLM 호출 없이 수집 대상만 확인"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-trend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      # 유료 API 는 rate limit 여유가 커서 간격을 짧게 둔다.
      LLM_MIN_CALL_INTERVAL_MS: "500"

      TREND_MAX_NEW: ${{ github.event.inputs.limit || '30' }}
      HN_MIN_SCORE: "150"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 키 확인
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿이 없습니다. https://platform.openai.com/api-keys 에서 발급해 등록하세요."
            exit 1
          fi

      - name: 트렌드 브리핑 수집 및 기사 생성
        # only 를 비워 두면 스크립트 기본값(github,hn,arxiv)이 쓰인다.
        # schedule 로 돌 때는 입력이 없으므로 세 출처를 모두 수집한다.
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only=${{ github.event.inputs.only }}"
          npm run sync:trend -- $ARGS
