name: 쇼케이스 동기화

# news.hada.io/show — 사람들이 직접 만든 것을 소개하는 게시판.
# 긱뉴스와 마찬가지로 제목·소개문·본문을 원문 그대로 저장하므로 LLM 을 쓰지 않는다.
# API 키가 필요 없고 비용도 들지 않는다.
#
# 상세 페이지 구조가 긱뉴스와 같아 본문 수집 코드(hada_contents)를 그대로 쓴다.
#
# 긱뉴스와 파일을 나눈 이유 — 한쪽이 실패해도 다른 쪽 실행 이력에 섞이지 않고,
# 재실행과 수동 dispatch 를 따로 걸 수 있다.

on:
  schedule:
    # 22:20 UTC = 07:20 KST
    # 긱뉴스(22:00)와 20분 띄운다. 같은 분에 두 잡이 같은 사이트를 치면 403 위험이
    # 커지고, GitHub 무료 러너의 정각 혼잡도 피할 수 있다.
    # 무료 러너의 schedule 은 수 분~수십 분 지연되거나 건너뛸 수 있다.
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전까지 수집할지"
        required: false
        default: "3"
      dry_run:
        description: "저장하지 않고 파싱 결과만 확인"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-hada-show
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SHOW_LOOKBACK_DAYS: ${{ github.event.inputs.days || '3' }}
      SHOW_MAX_PAGES: "5"
      # 한 실행에서 상세 페이지를 몇 장까지 받아 본문을 채울지.
      # 요청 사이에 1.5초를 두므로 40건이면 약 1~2분이다.
      HADA_CONTENT_MAX_PER_RUN: "40"
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 쇼케이스 수집
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run sync:showcase -- --dry-run
          else
            npm run sync:showcase
          fi
